<!DOCTYPE html>

<html>
    <head>
        <title>Your Perfect Day Membership</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/styles.css"/>
    </head>
    <body>
        <h1 class="head-group">Your Perfect Day</h1>
        <nav class="navbar" aria-label="Main navigation">
            <div class="list-group">
                <h3><a href="index.html">Home Page</a></h3>
                <h3><a href="membership.html">Become a Member</a></h3>
                <h3><a href="FriendFinder.html">Find Friends</a></h3>
            </div>
        </nav>
        <hr>
        <h2 class="head-group">Membership</h2>
        <h4 class="head-group">Sign up now and connect with people you're most compatible with from all over the world!</h4>
        <br>
        <div class="img-group">
            <img src="https://s.yimg.com/lo/mysterio/api/51f863f1d84fc7318f44d1b105f9d6609a42aa47edcc22933726776b741a5dcf/lightyear_networkapi/resizefill_w1080_h607%3Bquality_80%3Bformat_webp/https%3A%2F%2Fmedia.zenfs.com%2Fen%2Fknow_your_meme_909%2Ffdb21e0647ec3fc0193d1f7a8a44a720.jpg"
            alt="Dolphins"
            width="550px"
            height="300px"
            />
            <img src="https://geology.com/world/world-map.gif"
            alt="World Map"
            width="500px"
            height="300px"
            />
        </div>
        <br><br><hr><br>
        <h2 class="head-group">Tell us about yourself!</h2>
        <br>
        <form id="profileForm">
            <div class="info-group">
                <input type="firstname" id="firstname" placeholder="First Name" required>
                <input type="lastname" id="lastname" placeholder="Last Name" required>
                <input type="number" id="age" placeholder="Age" required>
                <input type="email" id="email" placeholder="Email" required>
                <select id="gender" required>
                    <option>Female</option>
                    <option>Male</option>
                    <option>Other</option>
                </select>
                <select id="city" required>
                    <option>Ajax</option>
                    <option>Aurora</option>
                    <option>Brampton</option>
                    <option>Brock</option>
                    <option>Burlington</option>
                    <option>Caledon</option>
                    <option>Clarington</option>
                    <option>East Gwilimbury</option>
                    <option>Georgina</option>
                    <option>Halton Hills</option>
                    <option>King</option>
                    <option>Markham</option>
                    <option>Milton</option>
                    <option> Mississauaga</option>
                    <option>Newmarket</option>
                    <option>Oakville</option>
                    <option>Oshawa</option>
                    <option>Pickering</option>
                    <option>Richmond Hill</option>
                    <option>Scugog</option>
                    <option>Toronto</option>
                    <option>Uxbridge</option>
                    <option>Vaughan</option>
                    <option>Whitby</option>
                    <option>Whitchurch-Stouffville</option>
                    <option>Other</option>
                </select>
                <input type="text" id="hobbies" placeholder="Hobbies" required>
            </div>
        <br><br>
        <fieldset>
            <legend>Free Days of the Week:</legend>
            <br>
            <div class="days-group">
                <label><input type="checkbox" name="day" value="Monday"> Monday</label>
                <label><input type="checkbox" name="day" value="Tuesday"> Tuesday</label>
                <label><input type="checkbox" name="day" value="Tuesday"> Wednesday</label>
                <label><input type="checkbox" name="day" value="Tuesday"> Thursday</label>
                <label><input type="checkbox" name="day" value="Tuesday"> Friday</label>
                <label><input type="checkbox" name="day" value="Tuesday"> Saturday</label>
                <label><input type="checkbox" name="day" value="Tuesday"> Sunday</label>
            </div>
            <br><br>
        </fieldset>
        <br>
        <button style="width: 150px; height: 50px;" type="submit" href="FriendFinder.html">Find Matches!</button>
    </form>
    <br><br><br><br><br>
    <p>© All rights reserved. Friend Finder.</p>
    <br><br><br>
    <script>
        const form = document.getElementById("profileForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const age = document.getElementById("age").value;

            localStorage.setItem("age", age);

            window.location.href = "friendfinder.html";
        });
    </script>
    </body>
</html>
